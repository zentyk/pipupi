<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipupi</title>
    <link rel="stylesheet" href="css/styles.css">	
</head>
    <link rel="manifest" href="manifest.json">
</head>
<body>
	<header>
		<h2 class="logo">Pipupi</h2>
	</header>
	<section id="advice">	
		<p>Asegurate de estar en </p><strong>pipupi.app</strong></p>
		<!--a href="http://pipupi.app">Por que estoy viendo esto?</a-->
	</section>

	<section id="main">
		<section id="hasLink">
			<h2>Recibiste un link generado seguro!</h2>
			<div class="link">
				<a id="receivedLink">Visitar Link</a>
			</div>
		</section>
		<section id="no-link">
			<h2>Genera tu link de whatsapp o contacta a alguien en segundos!</h2>
			<button class="social-btn" onclick="setSocial('wa')">
				<img id="whaicon" src="./img/whatssapp.png" alt="Whatsapp Icon" height="50" width="50">
			</button>	
			
			<label for="num">Escribe tu numero de whatsapp</label>
			<input id="num" type="number" inputmode="numeric" maxlength="10" placeholder="Ingresa tu numero" pattern="[0-9]{10}" required onKeyDown="avoidLetters(event)">

			<!--label for="msg">Cifrar link?</label>
			<input type="checkbox" id="cypher" name="cypher" value="cypher"-->
	
			<button class="pipupiBtn" onclick="generateLink(successMsg)">Generar link</button>
		
			<button class="pipupiBtn" id="shareBtn">Compartir link</button>
			<div class="copy-link">
				<input type="text" id="links" readonly>
				<button class="pipupiBtn" id="copyBtn" onclick="copyLink()">
					Copiar
				</button>
			</div>
			<button class="pipupiBtn" onclick="openLink()">Visitar Link</button>	
		</section>	
	</section>
	<br>
	<footer>
      <p>Pipupi © 2023 </p>
    </footer>
    <script src="js/app.js"></script>
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8052537613003818"
     crossorigin="anonymous"></script>

</body>
</html>
